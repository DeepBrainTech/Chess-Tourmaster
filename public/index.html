<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Tourmaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Parse hash parameters (#token=...&locale=...)
        function getHashParams() {
            const hash = window.location.hash.substring(1);
            const params = {};
            hash.split('&').forEach(part => {
                const [key, value] = part.split('=');
                if (key && value) {
                    params[key] = decodeURIComponent(value);
                }
            });
            return params;
        }

        // Extract token
        const params = getHashParams();
        const jwtToken = params.token;

        if (!jwtToken) {
            console.log("No token provided. Running in default mode.");
        }

        // Decode the JWT payload
        function decodeJwt(token) {
            try {
                if (!token) return null;
                const payload = token.split('.')[1];
                const base64 = payload.replace(/-/g, '+').replace(/_/g, '/');
                const json = decodeURIComponent(atob(base64).split('').map(c =>
                    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
                ).join(''));

                return JSON.parse(json);
            } catch (err) {
                console.error("Error decoding JWT:", err);
                return null;
            }
        }

        const userData = decodeJwt(jwtToken);
        console.log("Decoded Token: ", userData);

        // Extract user data
        let USER_ID = null;
        let USERNAME = "Guest";

        if (userData) {
            USER_ID = userData.user_id;
            USERNAME = userData.username;
        }

        console.log("User ID:", USER_ID);
        console.log("Username:", USERNAME);

        // 替换原有的 localStorage 函数为 API 调用
        async function saveProgress(progressObj) {
            if (!USER_ID || !jwtToken) {
                console.warn("No user ID or token, cannot save progress");
                return;
            }

            try {
                const response = await fetch('/api/progress/save', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${jwtToken}`,
                    },
                    body: JSON.stringify({
                        high_score: progressObj.highScore,
                        total_levels: progressObj.totalLevels || 0,
                    }),
                });

                const data = await response.json();
                if (data.success) {
                    console.log("Progress saved:", data.data);
                } else {
                    console.error("Failed to save progress:", data.message);
                }
            } catch (error) {
                console.error("Error saving progress:", error);
            }
        }

        async function loadProgress() {
            if (!USER_ID || !jwtToken) {
                console.warn("No user ID or token, cannot load progress");
                return null;
            }

            try {
                const response = await fetch('/api/progress/load', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${jwtToken}`,
                    },
                });

                const data = await response.json();
                if (data.success) {
                    console.log("Loaded progress:", data.data);
                    return {
                        highScore: data.data.high_score || 0,
                        totalLevels: data.data.total_levels || 0,
                    };
                } else {
                    console.error("Failed to load progress:", data.message);
                    return null;
                }
            } catch (error) {
                console.error("Error loading progress:", error);
                return null;
            }
        }
    </script>
    <!-- 继续保留原有的完整 HTML 结构和样式 -->
</head>
<body>
    <!-- 保留原有的完整游戏 HTML -->
    <script>
        // 保留原有的完整游戏逻辑，但 saveProgress 和 loadProgress 已在上面替换
    </script>
</body>
</html>
