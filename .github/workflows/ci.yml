name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tourmaster
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tourmaster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tourmaster -d tourmaster_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: chess-tourmaster
    env:
      DATABASE_URL: postgresql://tourmaster:ci-only-password@localhost:5432/tourmaster_test
      TOURMASTER_TEST_DATABASE_URL: postgresql://tourmaster:ci-only-password@localhost:5432/tourmaster_test
      TOURMASTER_GAME_DB_TEST: '1'
      TOURMASTER_INVENTORY_DB_TEST: '1'
      TOURMASTER_LEADERBOARD_DB_TEST: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chess-tourmaster/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run check
      - run: npm run build
