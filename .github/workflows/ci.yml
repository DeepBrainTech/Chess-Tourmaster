name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tourmaster
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tourmaster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tourmaster -d tourmaster_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: chess-tourmaster
    env:
      DATABASE_URL: postgresql://tourmaster:ci-only-password@localhost:5432/tourmaster_test
      TOURMASTER_TEST_DATABASE_URL: postgresql://tourmaster:ci-only-password@localhost:5432/tourmaster_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chess-tourmaster/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - name: Lint and type check
        run: |
          npm run lint
          npm run typecheck
      - name: Game logic and unit tests
        run: node --test --test-skip-pattern='^PostgreSQL:' tests/*.test.cjs
      - name: PostgreSQL integration tests
        shell: bash
        env:
          TOURMASTER_GAME_DB_TEST: '1'
          TOURMASTER_INVENTORY_DB_TEST: '1'
          TOURMASTER_LEADERBOARD_DB_TEST: '1'
        run: |
          report="$(mktemp)"
          trap 'rm -f "$report"' EXIT
          node --test --test-reporter=tap --test-name-pattern='^PostgreSQL:' \
            tests/game-database.test.cjs tests/inventory-delivery.test.cjs tests/leaderboard.test.cjs | tee "$report"
          grep -Fxq '1..3' "$report" && grep -Fxq '# skipped 0' "$report" || {
            echo "::error::Expected all three PostgreSQL suites to run without skips"
            exit 1
          }
      - name: Production build
        run: npm run build
