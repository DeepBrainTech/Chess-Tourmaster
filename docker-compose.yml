name: chess-tourmaster

services:
  game-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chess_tourmaster
    volumes:
      - game-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d chess_tourmaster"]
      interval: 3s
      timeout: 3s
      retries: 20

  game-web:
    build:
      context: ./chess-tourmaster
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_PORTAL_API_BASE: ${NEXT_PUBLIC_PORTAL_API_BASE:-https://api.deepbraintechnology.com}
        NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-https://deepbraintechnology.com}
    env_file:
      - ./chess-tourmaster/.env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://postgres:postgres@game-db:5432/chess_tourmaster
      PORT: "3000"
    ports:
      - "127.0.0.1:${GAME_PORT:-5173}:3000"
    depends_on:
      game-db:
        condition: service_healthy

volumes:
  game-data:
