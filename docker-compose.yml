version: '3.8'

services:
  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    container_name: chess-tourmaster-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chess_user
      POSTGRES_PASSWORD: chess_password_change_me
      POSTGRES_DB: chess_tourmaster
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - chess-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess_user -d chess_tourmaster"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chess-tourmaster-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://chess_user:chess_password_change_me@db:5432/chess_tourmaster?schema=public
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-change-me}
      - TOURMASTER_JWT_SECRET=${TOURMASTER_JWT_SECRET:-your-tourmaster-secret-change-me}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chess-network
    command: >
      sh -c "npx prisma db push --skip-generate && node server.js"

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: chess-tourmaster-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - chess-network

volumes:
  postgres_data:
    driver: local

networks:
  chess-network:
    driver: bridge
